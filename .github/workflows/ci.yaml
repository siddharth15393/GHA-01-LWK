name: Java Maven CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    name: Build and Test Java Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-github-actions-demo/pom.xml

      - name: Check Java Version
        run: java -version

      - name: Check Maven Version
        run: mvn -version

      - name: Run Maven Tests
        working-directory: ./java-github-actions-demo
        run: mvn clean test

      - name: Build Application
        working-directory: ./java-github-actions-demo
        run: mvn clean package

      - name: Run Java Application
        working-directory: ./java-github-actions-demo
        run: |
          echo "Deploying Application"
          echo "JAR Application available"
          ls -lh target/
